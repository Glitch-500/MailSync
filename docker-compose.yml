services:
  mailsync:
    build: .
    container_name: mailsync
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - FROM_NAME=${FROM_NAME:-MailSync}
      - ACCESS_KEY=${ACCESS_KEY}
